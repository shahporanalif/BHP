<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangalore Home Price Predictor</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="page-shell">
    <section class="hero" aria-label="Home price prediction">
      <div class="brand"><span class="brand-mark">⌂</span> HomeValue</div>
      <p class="eyebrow">BANGALORE PROPERTY ESTIMATOR</p>
      <h1>Find your home's estimated value.</h1>
      <p class="intro">Enter a few property details to get a quick price estimate in lakh.</p>
    </section>

    <section class="calculator-card" aria-labelledby="calculator-title">
      <div class="card-heading">
        <div>
          <p class="step">STEP 1 OF 1</p>
          <h2 id="calculator-title">Property details</h2>
        </div>
        <span class="secure-note">Quick estimate</span>
      </div>

      <form class="form" onsubmit="return false;">
        <div class="field-group">
          <label>Area <span>(square feet)</span></label>
          <div class="fixed-value">1,000 sq ft <span>Fixed area</span></div>
          <input type="hidden" id="uiSqft" name="Squareft" value="1000">
        </div>

        <fieldset class="field-group">
          <legend>BHK</legend>
          <div class="switch-field">
            <input type="radio" id="radio-bhk-1" name="uiBHK" value="1"/>
            <label for="radio-bhk-1">1</label>
            <input type="radio" id="radio-bhk-2" name="uiBHK" value="2" checked/>
            <label for="radio-bhk-2">2</label>
            <input type="radio" id="radio-bhk-3" name="uiBHK" value="3"/>
            <label for="radio-bhk-3">3</label>
            <input type="radio" id="radio-bhk-4" name="uiBHK" value="4"/>
            <label for="radio-bhk-4">4</label>
            <input type="radio" id="radio-bhk-5" name="uiBHK" value="5"/>
            <label for="radio-bhk-5">5</label>
          </div>
        </fieldset>

        <fieldset class="field-group">
          <legend>Bathrooms</legend>
          <div class="switch-field">
            <input type="radio" id="radio-bath-1" name="uiBathrooms" value="1"/>
            <label for="radio-bath-1">1</label>
            <input type="radio" id="radio-bath-2" name="uiBathrooms" value="2" checked/>
            <label for="radio-bath-2">2</label>
            <input type="radio" id="radio-bath-3" name="uiBathrooms" value="3"/>
            <label for="radio-bath-3">3</label>
            <input type="radio" id="radio-bath-4" name="uiBathrooms" value="4"/>
            <label for="radio-bath-4">4</label>
            <input type="radio" id="radio-bath-5" name="uiBathrooms" value="5"/>
            <label for="radio-bath-5">5</label>
          </div>
        </fieldset>

        <div class="field-group">
          <label for="uiLocations">Location</label>
          <select class="location" id="uiLocations">
            <option value="" disabled selected>Choose a location</option>
            <option>Electronic City</option>
            <option>Rajaji Nagar</option>
          </select>
        </div>

        <button class="submit" onclick="onClickedEstimatePrice()" type="button">Estimate price <span aria-hidden="true">→</span></button>
      </form>

      <div id="uiEstimatedPrice" class="result" aria-live="polite">
        <span class="result-label">Your estimated value will appear here</span>
      </div>
    </section>
  </main>
</body>
</html>
